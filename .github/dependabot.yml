# Weekly version updates, into develop: main only changes through release PRs (CONTRIBUTING.md). Each
# ecosystem's updates come as one grouped PR, so titles stay short enough for the commit format, e.g.
# "build(deps): bump the gradle group with 3 updates". A version must be a week old before it's
# proposed, so a release that's pulled for being compromised or broken usually never reaches a PR. The
# ECC submodule isn't listed on purpose: it's bumped by hand after reviewing upstream (CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]
